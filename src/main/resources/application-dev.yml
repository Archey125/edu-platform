# профиль dev: рабочая база postgresql
# хост и пароль из переменных окружения, дефолты для локальной разработки
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edu_platform}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # схема создается/обновляется автоматически по jpa моделям
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:INFO}
    com.example.eduplatform: DEBUG
