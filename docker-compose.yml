services:
  db:
    image: postgres:16-alpine
    container_name: edu-platform-db
    environment:
      POSTGRES_DB: edu_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edu_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: edu-platform-app
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/edu_platform
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DDL_AUTO: update
      SEED_DATA: "true"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
